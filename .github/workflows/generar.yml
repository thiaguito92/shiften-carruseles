name: Generar carrusel

on:
  workflow_dispatch:
    inputs:
      carrusel:
        description: JSON del carrusel en base64
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: generar-carrusel
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Leer carrusel
        env:
          CARRUSEL: ${{ inputs.carrusel }}
        run: printf '%s' "$CARRUSEL" | base64 --decode > entrada.json
      - run: node generar.mjs --archivo entrada.json
      - name: Guardar imágenes
        run: |
          git config user.name "shiften-carruseles"
          git config user.email "actions@users.noreply.github.com"
          git add salida
          git diff --cached --quiet || git commit -m "Agregar carrusel"
          git pull --rebase origin main
          git push origin HEAD:main
